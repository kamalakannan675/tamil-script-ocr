services:
  # Python Flask Backend Service
  - type: web
    name: tamil-script-ocr-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend wsgi:app -w 2 -b 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEVICE
        value: cpu
      - key: MAX_CONTENT_LENGTH
        value: "26214400"
      - key: CORS_ORIGINS
        value: "*"
      - key: CRNN_MODEL_PATH
        value: "backend/models/tamil_crnn.pt"

  # Static Frontend Site (React Vite)
  - type: static-site
    name: tamil-script-ocr-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://tamil-script-ocr-backend.onrender.com/api"
